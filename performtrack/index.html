<!DOCTYPE html>
<html lang="fr" style="margin: 0 !important; padding: 0 !important; width: 100% !important; height: 100% !important; background: #000000 !important;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="PerformTrack - Suivi de performance athlétique" />
  <title>PerformTrack</title>
  
  <!-- RESET CSS COMPLET - FORCE LA SUPPRESSION DES MARGES -->
  <style>
    /* Reset universel */
    * {
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }
    
    /* Force fullscreen sur html, body, root */
    html {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow-x: hidden !important;
      background: #000000 !important;
    }
    
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow-x: hidden !important;
      background: #000000 !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #ffffff !important;
    }
    
    #root {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100vh !important;
      overflow-x: hidden !important;
      background: #000000 !important;
    }
    
    /* Supprime les marges par défaut sur tous les éléments */
    div, p, h1, h2, h3, h4, h5, h6, ul, ol, li, form, input, button, select, textarea {
      margin: 0;
      padding: 0;
    }
    
    /* Supprime les contours sur focus */
    button:focus,
    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
    }
    
    /* Scrollbar personnalisée */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(102, 126, 234, 0.5) rgba(0, 0, 0, 0.2);
    }
    
    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    *::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }
    
    *::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
    }
    
    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }
    
    /* Mobile responsive */
    @media (max-width: 767px) {
      body {
        overflow-x: hidden !important;
      }
    }
  </style>
</head>
<body style="margin: 0 !important; padding: 0 !important; background: #000000 !important;">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root" style="margin: 0 !important; padding: 0 !important; background: #000000 !important;"></div>
  <script type="module" src="/index.jsx"></script>
</body>
</html>
